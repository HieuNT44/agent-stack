# Content copied into this repository from elsewhere.
#
# The files themselves live under knowledge/ and are committed here, so a
# generate run needs no network. This file records where they came from, which
# commit they were taken at, and what `npm run sync` copies when the pin moves.
#
# To update: `npm run sync -- --ref <new 40-char SHA>`, then review the diff.
version: 1

sources:
  agent-skills:
    repo: https://github.com/addyosmani/agent-skills.git
    ref: a120596f6d7ff9b967a3f5e0331ea911376ee5ef
    license: MIT
    license_url: https://github.com/addyosmani/agent-skills/blob/main/LICENSE
    copyright: Copyright (c) Addy Osmani
    # <upstream path> -> <path under knowledge/>
    copy:
      skills: skills/global
      .claude/commands: commands
    # <upstream path> -> where it lands in a generated project. Files the
    # imported skills and commands reach outside their own directory: /ship and
    # /webperf spawn the personas in agents/, and eleven skills link to
    # ../../references/. Each persona links to ../docs/agents.md, which links
    # back to both. Kept under knowledge/support/agent-skills/.
    support:
      agents: .claude/agents
      references: .claude/references
      docs/agents.md: .claude/docs/agents.md
